; PlatformIO build for the rover firmware.
;
;   pio run                  compile for the Teensy 4.1
;   pio run -t upload        compile and flash (board plugged in via USB)
;   pio device monitor       the boot banner and diagnostics
;
; The firmware entry point is firmware/rover_firmware.cpp -- a plain .cpp, not
; an Arduino .ino, so PlatformIO compiles it as an ordinary translation unit
; with no sketch preprocessing and no generated forward declarations. That
; means the Arduino IDE can no longer open this directly; PlatformIO is the
; build. See README.md if you need the IDE back.
;
; NOT YET COMPILED BY THE TEENSYDUINO TOOLCHAIN. See README.md "What is not
; done": every source here compiles and links under a host compiler against
; stub hardware headers, but the real arm-none-eabi build has never run.

[platformio]
; The firmware lives in firmware/, not the PlatformIO default src/. Everything
; under here is compiled recursively, which picks up firmware/src/*.cpp.
src_dir = firmware

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; rover_firmware.cpp says #include "src/rover_controller.h", relative to
; itself. That resolves on its own for a .cpp compiled in place, but naming
; firmware/ as an include root keeps it working regardless of how the build
; directory is arranged.
build_flags =
    -I firmware

; Same two libraries either toolchain needs. Pinned to the upstream repos
; because neither is published in the PlatformIO registry under a name stable
; enough to depend on.
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

monitor_speed = 115200
